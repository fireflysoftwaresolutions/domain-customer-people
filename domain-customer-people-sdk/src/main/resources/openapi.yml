openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Party Contact Queries
  description: Query endpoints for party contact information
- name: Customers
  description: CQ queries and registration for customers
- name: Consent Catalog
  description: Query endpoint for the active consent catalogue
- name: Businesses
  description: CQ queries and registration for businesses
- name: Relationships
  description: CQ queries and registration for party relationships
